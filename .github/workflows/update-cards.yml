name: Update card data

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write
  # Needed to dispatch ci.yml / deploy-pages.yml after the merge.
  actions: write

jobs:
  sync-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: solver_go/go.mod
          # No external deps, so there is no go.sum to key the cache on.
          cache: false

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Build Go solver
        working-directory: solver_go
        run: go build -o solver .

      - name: Get current card count
        id: before
        run: |
          COUNT=$(uv run python -c "from solver import load_cards; print(len(load_cards()))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Current: $COUNT cards"

      - name: Sync from HolodoriDB
        run: uv run python scripts/sync_holodori.py

      - name: Get updated card count
        id: after
        run: |
          COUNT=$(uv run python -c "from solver import load_cards; print(len(load_cards()))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "After sync: $COUNT cards"

      - name: Check for changes
        id: check
        run: |
          # sync_holodori.py stamps a fresh "generated" timestamp on every run,
          # so a plain `git diff` is always dirty and opens a no-op PR daily.
          # -I drops hunks whose changed lines are *all* timestamps; a hunk that
          # also touches source_commit or card data still counts as a change.
          if ! git diff --quiet -I '^[[:space:]]*"generated":' -- data/; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No substantive data changes detected"
          fi

      - name: Detect new cards
        if: steps.check.outputs.has_changes == 'true'
        id: diff
        run: |
          {
            echo "summary<<DIFF_EOF"
            uv run python -c "
          import json
          from subprocess import run as sp
          old = sp(['git', 'show', 'HEAD:data/cards.json'], capture_output=True, text=True).stdout
          old_ids = {c['id'] for c in json.loads(old)['cards']}
          with open('data/cards.json') as f:
              new_cards = json.load(f)['cards']
          new_ids = {c['id'] for c in new_cards}
          added = new_ids - old_ids
          removed = old_ids - new_ids
          if added:
              print('### 追加されたカード')
              for c in new_cards:
                  if c['id'] in added:
                      print(f'- **{c[\"character\"]}** {c[\"card_name\"]} ({c[\"type\"]})')
          if removed:
              print('### 削除されたカード')
              for rid in sorted(removed):
                  print(f'- {rid}')
          if not added and not removed:
              print('### データ更新のみ（カード数変化なし）')
          "
            echo "DIFF_EOF"
          } >> $GITHUB_OUTPUT

      - name: Run tests
        if: steps.check.outputs.has_changes == 'true'
        run: uv run pytest test_solver.py -v

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update card data (${{ steps.before.outputs.count }} → ${{ steps.after.outputs.count }} cards)"
          title: "chore: Update card data (${{ steps.before.outputs.count }} → ${{ steps.after.outputs.count }} cards)"
          body: |
            ## カードデータ更新

            - **更新前**: ${{ steps.before.outputs.count }} 枚
            - **更新後**: ${{ steps.after.outputs.count }} 枚
            - **ソース**: HolodoriDB/holodori-db-jpn-diff

            ${{ steps.diff.outputs.summary }}

          branch: update/card-data
          delete-branch: true
          labels: |
            dependencies
            automated

      # The PR is created with GITHUB_TOKEN, so ci.yml never triggers on it.
      # Waiting for checks would hang forever; instead we rely on the "Run tests"
      # step above, which must pass before this step is reached.
      - name: Merge Pull Request
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" \
            --squash --delete-branch

      # The merge commit is also authored by GITHUB_TOKEN, so it does not fire
      # the `push: branches: [main]` triggers either. workflow_dispatch is the
      # documented exception -- it always creates a run -- so request both
      # workflows explicitly. Note this bypasses the paths filter on
      # deploy-pages.yml, which is fine: a card data change always matches it.
      - name: Trigger downstream workflows
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref main
          gh workflow run deploy-pages.yml --ref main
