name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/cards.json'
      - 'solver.py'
      - 'solver_go/**'
      - 'build_static.py'
      - 'index.html'
      - 'wasm_bridge.js'
      - 'wasm_exec.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: solver_go/go.mod

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Build Go solver
        run: |
          cd solver_go && go build -o solver .
          cd solver_go && GOOS=js GOARCH=wasm go build -o solver.wasm .

      - name: Run tests
        run: uv run pytest test_solver.py -v

      - name: Build static HTML
        run: uv run python build_static.py

      - name: Prepare pages
        run: cp -r dist _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
