name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # update-cards.yml dispatches this after auto-merging its PR: a push made
  # with GITHUB_TOKEN does not trigger the push event above.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: solver_go/go.mod
          # No external deps, so there is no go.sum to key the cache on.
          cache: false

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv run playwright install --with-deps chromium

      - name: Build Go solver
        working-directory: solver_go
        run: |
          go build -o solver .
          GOOS=js GOARCH=wasm go build -o solver.wasm .

      - name: Build CLI
        if: hashFiles('cli/go.mod') != ''
        working-directory: cli
        run: go build -o holosolve .

      - name: Run tests
        run: |
          uv run python build_static.py
          uv run pytest test_solver.py test_e2e.py test_static_build.py -v
