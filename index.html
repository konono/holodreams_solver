<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoloSolve</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: #0f1923;
  color: #e0e6ed;
  min-height: 100vh;
}

.container { max-width: 1200px; margin: 0 auto; padding: 16px; }

header {
  text-align: center;
  padding: 24px 0 16px;
  border-bottom: 1px solid #2a3a4a;
  margin-bottom: 20px;
}
header h1 { font-size: 1.6rem; letter-spacing: 0.05em; }
header p { color: #8899aa; font-size: 0.85rem; margin-top: 4px; }

.controls {
  display: flex; gap: 10px; align-items: center;
  flex-wrap: wrap; margin-bottom: 16px;
}
.controls button {
  padding: 8px 18px; border: none; border-radius: 6px;
  font-size: 0.85rem; cursor: pointer; font-weight: 600;
  transition: transform 0.1s, opacity 0.15s;
}
.controls button:active { transform: scale(0.97); }

.btn-solve {
  background: linear-gradient(135deg, #4f8cff, #3b6fd9);
  color: #fff; font-size: 1rem; padding: 10px 28px;
}
.btn-solve:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-select-all { background: #2a3a4a; color: #c0cad4; }
.btn-clear { background: #2a3a4a; color: #c0cad4; }
.btn-filter { background: #1e2d3d; color: #8899aa; border: 1px solid #2a3a4a !important; font-size: 0.8rem; padding: 6px 12px; }
.btn-filter.active { border-color: #4f8cff !important; color: #4f8cff; }

.btn-pot-global {
  background: #1e2d3d; color: #8899aa; border: 1px solid #3a4f66 !important;
  font-size: 0.75rem; padding: 4px 10px; cursor: pointer; border-radius: 4px;
}
.btn-pot-global:hover { border-color: #4f8cff !important; color: #4f8cff; }

.counter {
  margin-left: auto; font-size: 0.9rem; color: #8899aa;
}
.counter strong { color: #4f8cff; font-size: 1.1rem; }

.group-section { margin-bottom: 20px; }
.group-title {
  font-size: 0.85rem; color: #6b7f92; margin-bottom: 8px;
  padding-left: 4px; border-left: 3px solid #3a4f66; padding: 2px 0 2px 8px;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
  gap: 8px;
}

.card {
  background: #1a2735;
  border: 2px solid #2a3a4a;
  border-radius: 8px;
  padding: 10px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.1s;
  user-select: none;
  position: relative;
}
.card:hover { background: #1e2f40; transform: translateY(-1px); }
.card.selected { border-color: #4f8cff; background: #1a2d45; }
.card.selected::after {
  content: "\2713"; position: absolute; top: 6px; right: 8px;
  color: #4f8cff; font-size: 1rem; font-weight: bold;
}

.card .char-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
.card .card-name { font-size: 0.72rem; color: #7a8c9e; line-height: 1.3; margin-bottom: 6px; }
.card .type-badge {
  display: inline-block; font-size: 0.65rem; padding: 1px 6px;
  border-radius: 3px; font-weight: 600;
}
.type-happy  { background: #3d2a0f; color: #f0a040; }
.type-pure   { background: #0f2a3d; color: #40a0f0; }
.type-cute   { background: #3d0f2a; color: #f040a0; }

.card .stats {
  display: flex; gap: 4px; margin-top: 6px; font-size: 0.65rem; color: #5a6e80;
}
.card .stats span { flex: 1; text-align: center; }

.pot-row {
  display: flex; gap: 2px; margin-top: 6px; align-items: center;
}
.pot-btn {
  width: 22px; height: 20px; border: 1px solid #3a4f66; border-radius: 3px;
  background: #0f1923; color: #6b7f92; font-size: 0.65rem; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.1s; padding: 0;
}
.pot-btn.active { background: #4f8cff; color: #fff; border-color: #4f8cff; }
.pot-btn:hover { border-color: #4f8cff; }

.pot-label { font-size: 0.6rem; color: #5a6e80; margin-right: 2px; }

.lv-row {
  display: flex; gap: 2px; margin-top: 4px; align-items: center;
}
.lv-label { font-size: 0.6rem; color: #5a6e80; margin-right: 2px; }
.lv-btn {
  width: 24px; height: 18px; border: 1px solid #3a4f66; border-radius: 3px;
  background: #0f1923; color: #6b7f92; font-size: 0.6rem; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.lv-btn:hover { border-color: #4f8cff; color: #4f8cff; }
.lv-input {
  width: 36px; height: 18px; border: 1px solid #3a4f66; border-radius: 3px;
  background: #0f1923; color: #e0e6ed; font-size: 0.65rem; text-align: center;
  padding: 0;
}
.lv-input:focus { border-color: #4f8cff; outline: none; }

.loading-area {
  text-align: center; color: #6b7f92; padding: 20px; display: none;
}
.loading-area.visible { display: block; }
.spinner {
  display: inline-block; width: 24px; height: 24px;
  border: 3px solid #2a3a4a; border-top-color: #4f8cff;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  vertical-align: middle; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.results-area { margin-top: 24px; }
.results-title {
  font-size: 1.1rem; font-weight: 700; margin-bottom: 16px;
  padding-bottom: 8px; border-bottom: 1px solid #2a3a4a;
}

.result-card {
  background: #1a2735;
  border: 1px solid #2a3a4a;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}
.result-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
}
.result-rank { font-size: 1.3rem; font-weight: 800; color: #4f8cff; }
.result-scores {
  display: flex; gap: 16px; font-size: 0.8rem; color: #8899aa; flex-wrap: wrap;
}
.result-scores .main-score {
  font-size: 1.1rem; font-weight: 700; color: #e0e6ed;
}

.result-members {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px;
}
.member-card {
  background: #0f1923;
  border: 1px solid #2a3a4a;
  border-radius: 6px;
  padding: 8px 10px;
  position: relative;
}
.member-card.is-leader {
  border-color: #ffd700;
  background: #1a1f0f;
}
.member-card.is-leader::before {
  content: "\2605 \30EA\30FC\30C0\30FC";
  position: absolute; top: -9px; left: 8px;
  font-size: 0.6rem; background: #ffd700; color: #0f1923;
  padding: 0 6px; border-radius: 3px; font-weight: 700;
}
.member-card .m-name { font-weight: 700; font-size: 0.85rem; }
.member-card .m-card-name { font-size: 0.7rem; color: #6b7f92; }
.member-card .m-stats {
  display: flex; gap: 4px; margin-top: 4px; font-size: 0.65rem; color: #5a6e80;
}
.member-card .m-stats span { flex: 1; }
.member-card .m-pot-lv {
  font-size: 0.6rem; color: #4f8cff; margin-top: 2px;
}

.empty-msg {
  text-align: center; color: #5a6e80; padding: 40px;
  font-size: 0.9rem;
}

.history-entry {
  background: #1a2735; border: 1px solid #2a3a4a; border-radius: 8px;
  padding: 10px 12px; margin-bottom: 8px; font-size: 0.8rem;
}
.history-entry .h-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 4px; flex-wrap: wrap; gap: 6px;
}
.history-entry .h-time { color: #6b7f92; font-size: 0.75rem; }
.history-entry .h-score { color: #4f8cff; font-weight: 700; }
.h-btn {
  background: #1e2d3d; color: #8899aa; border: 1px solid #3a4f66;
  border-radius: 4px; padding: 2px 8px; font-size: 0.7rem; cursor: pointer;
}
.h-btn:hover { border-color: #4f8cff; color: #4f8cff; }
.h-label-input {
  background: #0f1923; color: #e0e6ed; border: 1px solid #3a4f66;
  border-radius: 3px; font-size: 0.72rem; padding: 1px 4px; width: 120px;
}
.h-label-input:focus { border-color: #4f8cff; outline: none; }

.fab-container {
  display: none; position: fixed; bottom: 20px; right: 20px; z-index: 100;
  flex-direction: column; gap: 10px; align-items: flex-end;
}
.fab-btn {
  background: linear-gradient(135deg, #4f8cff, #3b6fd9); color: #fff;
  padding: 12px 20px; border-radius: 28px; font-size: 0.9rem; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  transition: transform 0.1s, opacity 0.15s; user-select: none;
}
.fab-btn:active { transform: scale(0.95); }
.fab-btn.disabled { opacity: 0.4; pointer-events: none; }
.fab-btn.fab-back {
  background: linear-gradient(135deg, #3a4f66, #2a3a4a);
}
.fab-recommend {
  background: linear-gradient(135deg, #ff8c4f, #d96b3b);
  font-size: 0.8rem; padding: 10px 16px;
}

@media (max-width: 600px) {
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }
  .result-members { grid-template-columns: 1fr; }
  .fab-container { display: flex; }
}
</style>
</head>
<body>
<div class="container">
  <header>

    <select id="acquireCount" style="background:#1e2d3d;border:1px solid #3a4f66;color:#f0a040;padding:6px 8px;border-radius:4px;font-size:0.8rem">

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:0.85rem;color:#8899aa;flex-wrap:wrap">

      <button class="btn-pot-global btn-lv-global" data-lv="30">Lv30</button>
      <button class="btn-pot-global btn-lv-global" data-lv="40">Lv40</button>
      <button class="btn-pot-global btn-lv-global" data-lv="50">Lv50</button>
      <button class="btn-pot-global btn-lv-global" data-lv="60">Lv60</button>
      <button class="btn-pot-global btn-lv-global" data-lv="70">Lv70</button>

    <select id="songSelect" style="background:#1e2d3d;border:1px solid #3a4f66;color:#8899aa;padding:4px 6px;border-radius:4px;font-size:0.75rem;max-width:200px">

        <select class="calib-member" style="background:#0f1923;border:1px solid #3a4f66;color:#e0e6ed;padding:4px;border-radius:4px;font-size:0.8rem"></select>

<script src="shared_render.js"></script>
<script>
const GROUP_ORDER = [
  "0期生","1期生","2期生","ゲーマーズ","3期生","4期生","5期生","holoX",
  "ID1期生","ID2期生","ID3期生","Myth","Promise","Advent","ReGLOSS","水着"
];

let CARDS = [];
let cardMap = {};
let levelTables = {};
const selected = new Set();
let activeFilter = "all";

let defaultPotential = 0;
let defaultLevel = 80;
const cardPotentials = {};
const cardLevels = {};
let levelEnabled = false;


function loadPersistence() {
  try {
    const sp = localStorage.getItem("holodri_card_potentials");
    if (sp) Object.assign(cardPotentials, JSON.parse(sp));
    const sl = localStorage.getItem("holodri_card_levels");
    if (sl) Object.assign(cardLevels, JSON.parse(sl));
    const dp = localStorage.getItem("holodri_default_potential");
    if (dp != null) defaultPotential = parseInt(dp) || 0;
    const dl = localStorage.getItem("holodri_default_level");
    const le = localStorage.getItem("holodri_level_enabled");
    if (dl != null) {
      defaultLevel = parseInt(dl) || 80;
    } else if (le === "true") {
      defaultLevel = 40;
    }
    if (le != null) levelEnabled = le === "true";
    const acm = localStorage.getItem("holodri_all_cards_mode");
    if (acm === "false") {
      for (const id of new Set([...Object.keys(cardPotentials), ...Object.keys(cardLevels)])) selected.add(id);
    }
  } catch {}
}

function savePersistence() {
  const isAllCards = selected.size === 0;
  const savedPots = {};
  const savedLvs = {};
  if (isAllCards) {
    for (const [id, v] of Object.entries(cardPotentials)) { if (v !== defaultPotential) savedPots[id] = v; }
    for (const [id, v] of Object.entries(cardLevels)) { if (v !== defaultLevel) savedLvs[id] = v; }
  } else {
    for (const id of selected) {
      if (id in cardPotentials) savedPots[id] = cardPotentials[id];
      if (id in cardLevels) savedLvs[id] = cardLevels[id];
    }
  }
  localStorage.setItem("holodri_card_potentials", JSON.stringify(savedPots));
  localStorage.setItem("holodri_card_levels", JSON.stringify(savedLvs));
  localStorage.setItem("holodri_default_potential", String(defaultPotential));
  localStorage.setItem("holodri_default_level", String(defaultLevel));
  localStorage.setItem("holodri_level_enabled", String(levelEnabled));

}

}

function getSelectedChartScore() {
  const songId = document.getElementById("songSelect").value;
  if (!songId || !window.CHART_SCORES) return null;
  const diff = document.getElementById("diffSelect").value || "expert";
  return window.CHART_SCORES[`${songId}_${diff}`] || null;
}

function getStabilityCharts() {
  if (!window.CHART_SCORES || !window.SONGS) return null;
  const currentSongId = document.getElementById("songSelect").value;
  const diff = document.getElementById("diffSelect").value || "expert";
  const targets = [95, 115, 130, 145, 160];
  const songList = Object.values(window.SONGS).sort((a, b) => a.playing_seconds - b.playing_seconds);
  const picked = [];
  for (const target of targets) {
    let best = null, bestDist = Infinity;
    for (const s of songList) {
      if (s.id === currentSongId) continue;
      const key = `${s.id}_${diff}`;
      if (!window.CHART_SCORES[key]) continue;
      const dist = Math.abs(s.playing_seconds - target);
      if (dist < bestDist) { bestDist = dist; best = key; }
    }
    if (best && !picked.includes(best)) picked.push(best);
  }
  return picked.map(key => window.CHART_SCORES[key]);
}

async function init() {
  loadPersistence();
  syncLevelUI();
  let res;
  try { res = await fetch("/api/cards"); } catch {
    document.getElementById("cardArea").innerHTML = '<div class="empty-msg">サーバーに接続できません。uv run python app.py で起動してください。</div>';
    return;
  }
  if (!res.ok) {
    document.getElementById("cardArea").innerHTML = '<div class="empty-msg">カードデータの取得に失敗しました。</div>';
    return;
  }
  const data = await res.json();
  CARDS = data.cards;
  levelTables = data.level_tables || {};
  cardMap = {};
  for (const c of CARDS) cardMap[c.id] = c;
  for (const id of [...selected]) { if (!cardMap[id]) selected.delete(id); }
  document.getElementById("totalCount").textContent = CARDS.length;
  renderCards();
  updateCounter();

  try {
    const songsRes = await fetch("/api/songs");
    if (songsRes.ok) {
      const songsData = await songsRes.json();
      window.SONGS = {};
      const songSel = document.getElementById("songSelect");
      const songsByRange = {};
      const ranges = [
        [0, 99, "~99秒"],
        [100, 119, "100~119秒"],
        [120, 139, "120~139秒"],
        [140, 159, "140~159秒"],
        [160, 999, "160秒~"],
      ];
      const sorted = (songsData.songs || []).slice().sort((a, b) => a.playing_seconds - b.playing_seconds || a.name.localeCompare(b.name));
      for (const s of sorted) {
        window.SONGS[s.id] = s;
        const range = ranges.find(r => s.playing_seconds >= r[0] && s.playing_seconds <= r[1]);
        const label = range ? range[2] : "その他";
        (songsByRange[label] = songsByRange[label] || []).push(s);
      }
      for (const [, , label] of ranges) {
        const group = songsByRange[label];
        if (!group) continue;
        const optgroup = document.createElement("optgroup");
        optgroup.label = `${label} (${group.length}曲)`;
        for (const s of group) {
          const opt = document.createElement("option");
          opt.value = s.id;
          opt.dataset.seconds = s.playing_seconds;
          opt.textContent = `${s.name} (${s.playing_seconds}秒)`;
          optgroup.appendChild(opt);
        }
        songSel.appendChild(optgroup);
      }
    }
  } catch {}
  try {
    const chartRes = await fetch("/api/chart_scores");
    if (chartRes.ok) {
      window.CHART_SCORES = await chartRes.json();
      console.log(`chart_scores loaded: ${Object.keys(window.CHART_SCORES).length} charts`);
    } else {
      console.warn("chart_scores not available:", chartRes.status);
    }
  } catch (e) {
    console.warn("chart_scores fetch failed:", e);
  }
  document.getElementById("songSelect").addEventListener("change", function() {
    document.getElementById("diffSelect").style.display = this.value ? "" : "none";
  });
  // デフォルト曲を設定（chart_scoresデータがある最初の曲）
  if (window.CHART_SCORES && document.getElementById("songSelect").value === "") {
    const defaultSong = "m0091";
    const sel = document.getElementById("songSelect");
    if (sel.querySelector(`option[value="${defaultSong}"]`)) {
      sel.value = defaultSong;
      document.getElementById("diffSelect").style.display = "";
    }
  }
  renderHistory();
}

function groupCards() {
  const groups = {};
  for (const c of CARDS) {
    const g = c.variant === "水着" ? "水着" : c.group;
    (groups[g] = groups[g] || []).push(c);
  }
  return groups;
}

function renderCards() {
  const area = document.getElementById("cardArea");
  area.innerHTML = "";

  for (const gName of GROUP_ORDER) {
    const cards = groups[gName];
    if (!cards) continue;
    const filtered = activeFilter === "all" ? cards : cards.filter(c => c.type === activeFilter);
    if (filtered.length === 0) continue;

    const section = document.createElement("div");
    section.className = "group-section";
    section.innerHTML = `<div class="group-title">${gName}</div>`;
    const grid = document.createElement("div");
    grid.className = "card-grid";

    for (const card of filtered) {
      const el = document.createElement("div");
      el.className = "card" + (selected.has(card.id) ? " selected" : "");
      el.dataset.id = card.id;
      const pot = getCardPotential(card.id);
      const lv = getCardLevel(card.id);
      const s = getCardStats(card, pot, lv);

      el.innerHTML = `
        <div class="char-name">${card.character}</div>
        <div class="card-name">${card.card_name}</div>
        <span class="type-badge type-${card.type}">${TYPE_LABELS[card.type]}</span>
        <div class="stats" data-card-id="${card.id}">
          <span>P:${s.performance.toLocaleString()}</span>
          <span>T:${s.technique.toLocaleString()}</span>
          <span>S:${s.sense.toLocaleString()}</span>
        </div>
        <div class="pot-row">
          <span class="pot-label">凸:</span>
          ${[0,1,2,3,4].map(p => `<button class="pot-btn${p === pot ? ' active' : ''}" data-pot="${p}" data-card="${card.id}">${p}</button>`).join("")}
        </div>
        <div class="lv-row" style="${levelEnabled ? '' : 'display:none'}">
          <span class="lv-label">Lv:</span>
          <button class="lv-btn" data-delta="-10" data-card="${card.id}">-10</button>
          <input class="lv-input" type="number" value="${lv}" min="1" max="${MAX_LEVEL}" data-card="${card.id}">
          <button class="lv-btn" data-delta="10" data-card="${card.id}">+10</button>
        </div>`;

      el.querySelector(".char-name").addEventListener("click", () => toggleCard(card.id, el));
      el.querySelector(".card-name").addEventListener("click", () => toggleCard(card.id, el));
      el.querySelector(".type-badge").addEventListener("click", () => toggleCard(card.id, el));

      function autoSelect() {
        if (selected.size > 0 && !selected.has(card.id)) {
          selected.add(card.id); el.classList.add("selected"); updateCounter();
        }
      }

      el.querySelectorAll(".pot-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          cardPotentials[card.id] = parseInt(btn.dataset.pot);
          autoSelect();
          savePersistence();
          updateCardDisplay(card.id, el);
        });
      });

      el.querySelectorAll(".lv-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const currentLv = getCardLevel(card.id);
          cardLevels[card.id] = Math.max(1, Math.min(currentLv + parseInt(btn.dataset.delta), MAX_LEVEL));
          autoSelect();
          savePersistence();
          updateCardDisplay(card.id, el);
        });
      });

      const lvInput = el.querySelector(".lv-input");
      lvInput.addEventListener("click", (e) => e.stopPropagation());
      lvInput.addEventListener("change", (e) => {
        e.stopPropagation();
        const newLv = Math.max(1, Math.min(parseInt(lvInput.value) || 1, MAX_LEVEL));
        cardLevels[card.id] = newLv;
        lvInput.value = newLv;
        autoSelect();
        savePersistence();
        updateCardDisplay(card.id, el);
      });

      grid.appendChild(el);
    }
    section.appendChild(grid);
    area.appendChild(section);
  }
}

function updateCardDisplay(cardId, el) {
  const card = cardMap[cardId];
  const pot = getCardPotential(cardId);
  const lv = getCardLevel(cardId);
  const s = getCardStats(card, pot, lv);

  const statsEl = el.querySelector(".stats");
  statsEl.innerHTML = `
    <span>P:${s.performance.toLocaleString()}</span>
    <span>T:${s.technique.toLocaleString()}</span>
    <span>S:${s.sense.toLocaleString()}</span>`;

  el.querySelectorAll(".pot-btn").forEach(btn => {
    btn.classList.toggle("active", parseInt(btn.dataset.pot) === pot);
  });

  const lvInput = el.querySelector(".lv-input");
  lvInput.value = lv;
  lvInput.max = MAX_LEVEL;
}

function toggleCard(id, el) {
  if (selected.has(id)) {
    selected.delete(id); el.classList.remove("selected");

    if (!(id in cardPotentials)) cardPotentials[id] = getCardPotential(id);

  savePersistence();
  updateCounter();
}

document.getElementById("btnPasteIds").addEventListener("click", async () => {
  const btn = document.getElementById("btnPasteIds");
  let text;
  try {
    text = await navigator.clipboard.readText();
  } catch {
    text = prompt("カードデータのJSONを貼り付けてください:");
  }
  if (!text) return;
  try {
    const parsed = JSON.parse(text);
    const validIds = new Set(CARDS.map(c => c.id));
    selected.clear();
    let loaded = 0;
    if (Array.isArray(parsed)) {
      for (const id of parsed) {
        if (validIds.has(id)) {
          selected.add(id); loaded++;
          cardPotentials[id] = getCardPotential(id);
        }
      }
      savePersistence();
    } else if (parsed && parsed.v === 1) {
      for (const k of Object.keys(cardPotentials)) delete cardPotentials[k];
      for (const k of Object.keys(cardLevels)) delete cardLevels[k];
      if (!parsed.allCards) {
        for (const id of (parsed.ids || [])) {
          if (validIds.has(id)) {
            selected.add(id); loaded++;
            if (!(id in cardPotentials)) cardPotentials[id] = parsed.defaultPotential ?? defaultPotential;
          }
        }
      } else {
        loaded = (parsed.ids || []).filter(id => validIds.has(id)).length;
      }
      if (parsed.defaultPotential != null) defaultPotential = parsed.defaultPotential;
      if (parsed.defaultLevel != null) defaultLevel = parsed.defaultLevel;
      if (parsed.potentials) {
        for (const [id, p] of Object.entries(parsed.potentials)) {
          if (validIds.has(id)) cardPotentials[id] = p;
        }
      }
      if (parsed.levels) {
        for (const [id, l] of Object.entries(parsed.levels)) {
          if (validIds.has(id)) cardLevels[id] = l;
        }
      }
      if (parsed.levelEnabled != null) levelEnabled = parsed.levelEnabled;
      if (parsed.statScale != null) {
        statScale = parsed.statScale;
        localStorage.setItem("holodri_stat_scale", statScale.toString());
      }
      if (parsed.baseline != null) {
        baseline = parsed.baseline;
        localStorage.setItem("holodri_baseline", baseline.toString());
      }
      syncLevelUI();
      updateBaselineDisplay();
      savePersistence();
    } else {
      throw new Error("不明な形式");
    }
    renderCards();
    updateCounter();
    btn.textContent = (parsed && parsed.allCards) ? "全カード読込!" : loaded + "枚読込!";
    setTimeout(() => btn.textContent = "ID貼付", 1500);
  } catch {
    btn.textContent = "形式エラー";
    setTimeout(() => btn.textContent = "ID貼付", 1500);
  }
});

document.getElementById("btnCalibrate").addEventListener("click", async () => {
  const l1 = document.getElementById("calibLeader1").value;
  const l2 = document.getElementById("calibLeader2").value;
  const s1 = parseInt(document.getElementById("calibScore1").value);
  const s2 = parseInt(document.getElementById("calibScore2").value);

  if (!l1 || !l2 || isNaN(s1) || isNaN(s2) || s1 <= 0 || s2 <= 0) {
    document.getElementById("calibResult").innerHTML = '<span style="color:#f06060">リーダーとスコア（正の整数）を両方入力してください</span>';
    return;
  }
  if (l1 === l2) {
    document.getElementById("calibResult").innerHTML = '<span style="color:#f06060">異なるリーダーを選んでください</span>';
    return;
  }
  const teamIds = [...document.querySelectorAll(".calib-member")].map(s => s.value);
  if (new Set(teamIds).size < 5) {
    document.getElementById("calibResult").innerHTML = '<span style="color:#f06060">5人のメンバーを重複なく選択してください</span>';
    return;
  }
  const teamChars = teamIds.map(id => cardMap[id]?.character);
  if (new Set(teamChars).size < 5) {
    document.getElementById("calibResult").innerHTML = '<span style="color:#f06060">同キャラの別カードは同時編成できません</span>';
    return;
  }
  if (!teamIds.includes(l1) || !teamIds.includes(l2)) {
    document.getElementById("calibResult").innerHTML = '<span style="color:#f06060">リーダーはチームメンバーから選んでください</span>';
    return;
  }

  const cardSpecs = {};
  for (const id of teamIds) {
    cardSpecs[id] = { potential: getCardPotential(id), level: getCardLevel(id) };
  }

  try {
    const res = await fetch("/api/calibrate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        member_ids: teamIds, leader_id_1: l1, game_score_1: s1, leader_id_2: l2, game_score_2: s2,
        card_specs: cardSpecs,
        song_length: getSelectedSongLength(),
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `サーバーエラー (${res.status})`);
    }
    const data = await res.json();
    if (typeof data.stat_scale !== "number" || isNaN(data.stat_scale)) {
      throw new Error("不正な補正値が返されました");
    }
    statScale = data.stat_scale;
    baseline = data.baseline;
    localStorage.setItem("holodri_stat_scale", statScale.toString());
    localStorage.setItem("holodri_baseline", baseline.toString());
    updateBaselineDisplay();
    let calibMsg = `<span style="color:#40d080">補正完了: scale=${statScale.toFixed(4)} / H=${Math.round(baseline).toLocaleString()}<br>再計算してください。</span>`;
    if (data.warnings && data.warnings.length) {
      calibMsg += `<br><span style="color:#f0a040">${data.warnings.join("<br>")}</span>`;
    }
    document.getElementById("calibResult").innerHTML = calibMsg;
  } catch (e) {
    document.getElementById("calibResult").innerHTML = `<span style="color:#f06060">エラー: ${e.message}</span>`;
  }
});

let fabMode = "solve";
let isComputing = false;

async function doSolve() {
  if (isComputing) return;
  isComputing = true;
  const btn = document.getElementById("btnSolve");
  const btnRec = document.getElementById("btnRecommend");
  const fab = document.getElementById("fabSolve");
  const loading = document.getElementById("loadingArea");
  btn.disabled = true;
  btnRec.disabled = true;
  btn.textContent = "計算中...";
  fab.classList.add("disabled");
  fab.textContent = "計算中...";
  document.getElementById("fabRecommend").classList.add("disabled");
  loading.classList.add("visible");
  document.getElementById("resultsArea").innerHTML = "";

  try {
    const costumeVal = document.getElementById("costumeSelect").value || null;
    const memberInclude = document.getElementById("chkMemberInclude").checked;
    const fixedLeader = costumeVal && memberInclude ? costumeVal : null;
    const costumeOnlyLeader = costumeVal && !memberInclude ? costumeVal : null;
    let cardSpecs;
    if (selected.size === 0) {
      cardSpecs = CARDS.map(c => ({ id: c.id, potential: getCardPotential(c.id), level: getCardLevel(c.id) }));
    } else {
      cardSpecs = [...selected].map(id => ({ id, potential: getCardPotential(id), level: getCardLevel(id) }));
    }

    const solveBody = JSON.stringify({
      cards: cardSpecs, stat_scale: statScale, baseline,
      fixed_leader_id: fixedLeader,
      costume_only_leader_id: costumeOnlyLeader,
      sweep_costumes: !costumeVal,
      top_n: parseInt(document.getElementById("topN").value),
      song_length: getSelectedSongLength(),
      chart_score: getSelectedChartScore(),
      stability_charts: document.getElementById("chkStability").checked && getSelectedChartScore() ? getStabilityCharts() : null,
      stability_lengths: document.getElementById("chkStability").checked && !getSelectedChartScore() ? [95, 110, 125, 140, 155] : null,
    });

    const data = await new Promise((resolve, reject) => {
      const progressBar = document.getElementById("progressBarBg");
      const progressFill = document.getElementById("progressFill");
      const progressText = document.getElementById("progressText");
      progressBar.style.display = "none";
      progressFill.style.width = "0%";
      progressText.textContent = "最強編成を探索中...";

      fetch("/api/solve/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: solveBody,
      }).then(res => {
        if (!res.ok) return res.json().then(e => { throw new Error(e.detail || `サーバーエラー (${res.status})`); });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        function pump() {
          return reader.read().then(({ done, value }) => {
            if (done) { reject(new Error("ストリームが途中で終了しました")); return; }
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n\n");
            buffer = lines.pop();
            for (const chunk of lines) {
              const line = chunk.replace(/^data: /, "").trim();
              if (!line) continue;
              try {
                const ev = JSON.parse(line);
                if (ev.type === "progress") {
                  if (ev.current < 0) {
                    progressFill.style.width = "100%";
                    progressText.textContent = "Timeline評価 + ボード最適化中...";
                    return pump();
                  }
                  progressBar.style.display = "block";
                  const pct = Math.min(100, ev.current / ev.total * 100);
                  progressFill.style.width = pct + "%";
                  progressText.textContent = `${ev.current.toLocaleString()} / ${ev.total.toLocaleString()} 組み合わせを評価中...`;
                } else if (ev.type === "done") {
                  resolve(ev.result);
                  return;
                }
              } catch(e) {}
            }
            return pump();
          });
        }
        pump().catch(reject);
      }).catch(reject);
    });

    expandResults();
    renderResults(data);
    saveToHistory(data);
    document.getElementById("resultsWrapper").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    expandResults();
    document.getElementById("resultsArea").innerHTML =
      `<div class="empty-msg">エラーが発生しました: ${e.message}</div>`;
  } finally {
    isComputing = false;
    btn.disabled = false;
    btnRec.disabled = selected.size < 5;
    btn.textContent = "最強編成を探す";
    loading.classList.remove("visible");
    document.getElementById("progressBarBg").style.display = "none";
    document.getElementById("progressFill").style.width = "0%";
    document.getElementById("progressText").textContent = "最強編成を探索中...";
    setFabMode("back");
  }
}

function expandResults() {
  const wrapper = document.getElementById("resultsWrapper");
  const area = document.getElementById("resultsArea");
  const toggle = document.getElementById("resultsToggle");
  wrapper.style.display = "block";
  area.style.display = "block";
  toggle.textContent = "▼ 結果を折りたたむ";
}

function collapseResults() {
  const area = document.getElementById("resultsArea");
  const toggle = document.getElementById("resultsToggle");
  area.style.display = "none";
  toggle.textContent = "▶ 結果を表示";
}

function setFabMode(mode) {
  fabMode = mode;
  const fab = document.getElementById("fabSolve");
  const fabRec = document.getElementById("fabRecommend");
  fab.classList.remove("disabled");
  if (mode === "back") {
    fab.textContent = "カード編集に戻る";
    fab.classList.add("fab-back");
    fabRec.style.display = "none";
  } else {
    fab.classList.remove("fab-back");
    const disabled = selected.size > 0 && selected.size < 5;
    fab.classList.toggle("disabled", disabled);
    const count = selected.size || "全";
    fab.textContent = `探索 (${count}枚)`;
    fabRec.style.display = "";
    fabRec.classList.toggle("disabled", selected.size < 5);
  }
}

function updateFab() {
  if (fabMode === "solve") setFabMode("solve");
}

document.getElementById("btnSolve").addEventListener("click", doSolve);

document.getElementById("btnRecommend").addEventListener("click", doRecommend);

async function doRecommend() {
  if (selected.size < 5) return;
  const uniqueChars = new Set([...selected].map(id => cardMap[id]?.character).filter(Boolean));
  if (uniqueChars.size < 5) {
    expandResults();
    document.getElementById("resultsArea").innerHTML = '<div class="empty-msg">レコメンドには5キャラ以上のカードが必要です。</div>';
    return;
  }
  if (isComputing) return;
  isComputing = true;
  const btn = document.getElementById("btnRecommend");
  const btnSolve = document.getElementById("btnSolve");
  const fab = document.getElementById("fabSolve");
  const fabRec = document.getElementById("fabRecommend");
  const loading = document.getElementById("loadingArea");
  btn.disabled = true;
  btnSolve.disabled = true;
  btn.textContent = "分析中...";
  fab.classList.add("disabled");
  fab.textContent = "分析中...";
  fabRec.classList.add("disabled");
  const ac = parseInt(document.getElementById("acquireCount").value);
  const timeNote = ac >= 4 ? '（候補が多い場合1〜2分かかることがあります）' : '（候補ごとに再計算するため時間がかかります）';
  document.getElementById("progressText").textContent = `強化レコメンドを分析中...${timeNote}`;
  document.getElementById("progressBarBg").style.display = "none";
  document.getElementById("progressFill").style.width = "0%";
  loading.classList.add("visible");
  document.getElementById("resultsArea").innerHTML = "";

  try {
    const cardSpecs = [...selected].map(id => ({ id, potential: getCardPotential(id), level: getCardLevel(id) }));
    const recCostumeVal = document.getElementById("costumeSelect").value || null;
    const recMemberInclude = document.getElementById("chkMemberInclude").checked;
    const recBody = JSON.stringify({
      cards: cardSpecs, stat_scale: statScale, baseline,
      fixed_leader_id: recCostumeVal && recMemberInclude ? recCostumeVal : null,
      costume_only_leader_id: recCostumeVal && !recMemberInclude ? recCostumeVal : null,
      acquire_count: parseInt(document.getElementById("acquireCount").value),
      top_n: parseInt(document.getElementById("recommendTopN").value),
      song_length: getSelectedSongLength(),
      sweep_costumes: !recCostumeVal && selected.size >= 5,
    });

    const data = await new Promise((resolve, reject) => {
      const progressBar = document.getElementById("progressBarBg");
      const progressFill = document.getElementById("progressFill");
      const progressText = document.getElementById("progressText");

      fetch("/api/recommend/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: recBody,
      }).then(res => {
        if (!res.ok) return res.json().then(e => { throw new Error(e.detail || `サーバーエラー (${res.status})`); });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        function pump() {
          return reader.read().then(({ done, value }) => {
            if (done) { reject(new Error("ストリームが途中で終了しました")); return; }
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n\n");
            buffer = lines.pop();
            for (const chunk of lines) {
              const line = chunk.replace(/^data: /, "").trim();
              if (!line) continue;
              try {
                const ev = JSON.parse(line);
                if (ev.type === "progress") {
                  progressBar.style.display = "block";
                  const pct = Math.min(100, ev.current / ev.total * 100);
                  progressFill.style.width = pct + "%";
                  progressText.textContent = `${ev.current.toLocaleString()} / ${ev.total.toLocaleString()} 候補を評価中...`;
                } else if (ev.type === "done") {
                  resolve(ev.result);
                  return;
                }
              } catch (_) {}
            }
            return pump();
          });
        }
        pump().catch(reject);
      }).catch(reject);
    });

    expandResults();
    renderRecommendations(data);
    document.getElementById("resultsWrapper").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    expandResults();
    document.getElementById("resultsArea").innerHTML =
      `<div class="empty-msg">エラーが発生しました: ${e.message}</div>`;
  } finally {
    isComputing = false;
    btn.disabled = selected.size < 5;
    btnSolve.disabled = selected.size > 0 && selected.size < 5;
    btn.textContent = "強化レコメンド";
    document.getElementById("progressText").textContent = "最強編成を探索中...";
    document.getElementById("progressBarBg").style.display = "none";
    document.getElementById("progressFill").style.width = "0%";
    loading.classList.remove("visible");
    setFabMode("back");
  }
}

document.getElementById("fabSolve").addEventListener("click", () => {
  if (fabMode === "back") {
    collapseResults();
    setFabMode("solve");
    document.getElementById("cardArea").scrollIntoView({ behavior: "smooth" });
  } else {
    doSolve();
  }
});

document.getElementById("fabRecommend").addEventListener("click", () => {
  if (fabMode !== "back") doRecommend();
});

document.getElementById("resultsToggle").addEventListener("click", () => {
  const area = document.getElementById("resultsArea");
  if (area.style.display === "none") {
    expandResults();
  } else {
    collapseResults();
  }
});

function saveToHistory(solveData) {
  const ids = selected.size > 0 ? [...selected] : CARDS.map(c => c.id);
  const pots = {};
  const lvs = {};
  for (const id of ids) {
    const p = getCardPotential(id);
    if (p !== defaultPotential) pots[id] = p;
    const l = getCardLevel(id);
    if (l !== defaultLevel) lvs[id] = l;
  }
  const entry = {
    ts: Date.now(),
    label: "",
    settings: {
      topN: parseInt(document.getElementById("topN").value),
      costumeLeaderId: document.getElementById("costumeSelect").value || null,
      songLength: getSelectedSongLength(),
      songId: document.getElementById("songSelect").value || null,
      statScale, baseline,
    },
    snapshot: { ids: [...selected], allCards: selected.size === 0, potentials: pots, levels: lvs, defaultPotential, defaultLevel, levelEnabled },
    results: (solveData.timeline_results || solveData.results || []).slice(0, 3).map(r => ({
      rank: r.rank, unit_score: r.unit_score, total_power: r.total_power,
      score_bonus: r.score_bonus, live_score_index: r.live_score_index,
      leader_id: r.leader_id, member_ids: r.member_ids,
    })),
    isTimeline: !!solveData.timeline_results,
  };
  const resultKey = `holodri_result_${entry.ts}`;
  try { localStorage.setItem(resultKey, JSON.stringify(solveData)); } catch {}
  entry.resultKey = resultKey;
  let history = [];
  try { history = JSON.parse(localStorage.getItem("holodri_solve_history") || "[]"); } catch {}
  history.unshift(entry);
  if (history.length > 20) {
    for (const old of history.slice(20)) {
      if (old.resultKey) try { localStorage.removeItem(old.resultKey); } catch {}
    }
    history = history.slice(0, 20);
  }
  localStorage.setItem("holodri_solve_history", JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  let history = [];
  try { history = JSON.parse(localStorage.getItem("holodri_solve_history") || "[]"); } catch {}
  document.getElementById("historyCount").textContent = history.length;
  const area = document.getElementById("historyArea");
  if (!history.length) {
    area.innerHTML = '<div style="color:#5a6e80;padding:8px;font-size:0.8rem">履歴なし</div>';
    return;
  }
  let html = "";
  for (let i = 0; i < history.length; i++) {
    const h = history[i];
    const dt = new Date(h.ts);
    const timeStr = `${dt.getMonth()+1}/${dt.getDate()} ${dt.getHours()}:${String(dt.getMinutes()).padStart(2,"0")}`;
    const top1 = h.results[0];
    const nCards = (h.snapshot?.ids || []).length;
    const labelVal = (h.label || "").replace(/"/g, "&quot;");
    let scoreText = "-";
    let detailText = "";
    if (top1) {
      if (h.isTimeline && top1.live_score_index) {
        const lsi = top1.live_score_index;
        const m = lsi / 1e6;
        scoreText = m >= 1000 ? `LSI ${(m/1000).toFixed(1)}B` : `LSI ${Math.round(m).toLocaleString()}M`;
        const members = (top1.member_ids || []).map(id => cardMap[id]?.character || "?").slice(0, 3).join(", ");
        detailText = `#1 ${members} / ${nCards || "全"}枚`;
      } else {
        scoreText = top1.unit_score.toLocaleString();
        const leaderCard = top1.leader_id ? cardMap[top1.leader_id] : null;
        const leaderName = leaderCard ? leaderCard.character : "?";
        detailText = `#1 ${leaderName}リーダー / ${nCards || "全"}枚 / SB ${top1.score_bonus ?? "-"}%`;
      }
    }
    html += `<div class="history-entry">
      <div class="h-header">
        <span>
          <span class="h-time">${timeStr}</span>
          <input class="h-label-input" placeholder="メモ" value="${labelVal}" data-idx="${i}">
        </span>
        <span class="h-score">${scoreText}</span>
      </div>
      <div style="color:#8899aa;font-size:0.72rem">
        ${detailText}
      </div>
      <div style="display:flex;gap:4px;margin-top:6px">
        <button class="h-btn" data-action="restore" data-idx="${i}">復元</button>
        <button class="h-btn" data-action="delete" data-idx="${i}">削除</button>
      </div>
    </div>`;
  }
  area.innerHTML = html;
  area.querySelectorAll(".h-label-input").forEach(inp => {
    inp.addEventListener("click", e => e.stopPropagation());
    inp.addEventListener("change", () => {
      const idx = parseInt(inp.dataset.idx);
      let hist = [];
      try { hist = JSON.parse(localStorage.getItem("holodri_solve_history") || "[]"); } catch {}
      if (hist[idx]) { hist[idx].label = inp.value; localStorage.setItem("holodri_solve_history", JSON.stringify(hist)); }
    });
  });
  area.querySelectorAll(".h-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.idx);
      if (btn.dataset.action === "delete") deleteHistory(idx);
      else if (btn.dataset.action === "restore") restoreFromHistory(idx);
    });
  });
}

function deleteHistory(idx) {
  let history = [];
  try { history = JSON.parse(localStorage.getItem("holodri_solve_history") || "[]"); } catch {}
  const entry = history[idx];
  if (entry?.resultKey) try { localStorage.removeItem(entry.resultKey); } catch {}
  history.splice(idx, 1);
  localStorage.setItem("holodri_solve_history", JSON.stringify(history));
  renderHistory();
}

function restoreFromHistory(idx) {
  let history = [];
  try { history = JSON.parse(localStorage.getItem("holodri_solve_history") || "[]"); } catch {}
  const entry = history[idx];
  if (!entry || !entry.snapshot) return;
  const snap = entry.snapshot;
  const validIds = new Set(CARDS.map(c => c.id));

  for (const k of Object.keys(cardPotentials)) delete cardPotentials[k];
  for (const k of Object.keys(cardLevels)) delete cardLevels[k];

  selected.clear();
  const isAllCards = snap.allCards || (!(snap.ids || []).length && Object.keys(snap.potentials || {}).length > 0);
  const restoreIds = isAllCards ? CARDS.map(c => c.id) : (snap.ids || []);
  for (const id of restoreIds) {
    if (!isAllCards && validIds.has(id)) selected.add(id);
  }
  if (snap.defaultPotential != null) defaultPotential = snap.defaultPotential;
  if (snap.defaultLevel != null) defaultLevel = snap.defaultLevel;
  if (snap.levelEnabled != null) levelEnabled = snap.levelEnabled;
  for (const id of restoreIds) {
    if (!validIds.has(id)) continue;
    if (snap.potentials?.[id] != null) cardPotentials[id] = snap.potentials[id];
    else if (!isAllCards) cardPotentials[id] = snap.defaultPotential ?? defaultPotential;
    if (snap.levels?.[id] != null) cardLevels[id] = snap.levels[id];
  }
  if (entry.settings?.statScale != null) {
    statScale = entry.settings.statScale;
    localStorage.setItem("holodri_stat_scale", statScale.toString());
  }
  if (entry.settings?.baseline != null) {
    baseline = entry.settings.baseline;
    localStorage.setItem("holodri_baseline", baseline.toString());
  }
  if (entry.settings?.topN != null) document.getElementById("topN").value = entry.settings.topN;
  document.getElementById("costumeSelect").value = entry.settings?.costumeLeaderId || entry.settings?.fixedLeaderId || "";
  const songSel = document.getElementById("songSelect");
  songSel.value = entry.settings?.songId || "";
  document.getElementById("diffSelect").style.display = songSel.value ? "" : "none";

  savePersistence();
  syncLevelUI();
  updateBaselineDisplay();
  renderCards();
  updateCounter();

  if (entry.resultKey) {
    try {
      const savedData = JSON.parse(localStorage.getItem(entry.resultKey));
      if (savedData) {
        expandResults();
        renderResults(savedData);
        document.getElementById("resultsWrapper").scrollIntoView({ behavior: "smooth" });
      }
    } catch {}
  }
}

document.getElementById("historyToggle").addEventListener("click", () => {
  const area = document.getElementById("historyArea");
  const toggle = document.getElementById("historyToggle");
  if (area.style.display === "none") {
    area.style.display = "block";
    toggle.innerHTML = toggle.innerHTML.replace("▶", "▼");
  } else {
    area.style.display = "none";
    toggle.innerHTML = toggle.innerHTML.replace("▼", "▶");
  }
});


init();
