[tools]
go = "1.24"
jq = "latest"
node = "22"
python = "3.13"
uv = "latest"

[tasks.setup]
description = "開発環境セットアップ（依存+ソルバー+ブラウザ）"
run = """
uv sync --group dev
cd solver_go && go build -o solver . && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o solver.wasm .
uv run playwright install --with-deps chromium
"""

[tasks.test]
description = "全テスト実行"
run = "uv run pytest -v"

[tasks."test:unit"]
description = "ユニットテストのみ"
run = "uv run pytest test_solver.py -v"

[tasks."test:e2e"]
description = "E2Eテストのみ"
run = "uv run pytest test_e2e.py -v"

[tasks.build]
description = "スタンドアロン版HTML生成"
run = "uv run python build_static.py"

[tasks."build:solver"]
description = "Goソルバービルド（CLI + WASM）"
dir = "solver_go"
run = """
go build -o solver .
GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o solver.wasm .
"""

[tasks.dev]
description = "Goソルバーリビルド + 開発サーバー起動"
run = """
(cd solver_go && go build -o solver .)
uv run python app.py
"""

[tasks."sync:all"]
description = "全データ同期（カード + ボード + チャート）"
depends = ["sync:cards", "sync:charts"]

[tasks."sync:cards"]
description = "カード・ボードデータ同期（HolodoriDB）"
run = "uv run python scripts/sync_holodori.py"

[tasks."sync:charts"]
description = "チャートデータ更新（CDNから差分DL + 不足分個別取得 + ビン集約生成）"
run = """
set -e
echo "==> Step 0: 依存ツールのインストール"
uv pip install git+https://github.com/HolodoriDB/holodori-asset-tools.git git+https://github.com/UntitledCharts/sonolus-level-converters.git

echo "==> Step 1: 差分ダウンロード"
uv run python3 -m holodori_asset_tools download /tmp/holodori_assets --filter 'chart_m' --workers 4 --no-overwrite

echo "==> Step 2: 不足曲の個別取得"
uv run python3 -c "
from holodori_asset_tools.catalog import fetch
from holodori_asset_tools.crypto import decrypt
import httpx, json
from pathlib import Path

with open('data/songs.json') as f:
    song_ids = {s['id'] for s in json.load(f)['songs']}

existing = {p.stem.rsplit('_', 1)[0].replace('chart_','')
            for p in Path('/tmp/holodori_assets/resources').glob('chart_m*_expert.sus')}
missing = song_ids - existing
if not missing:
    print('All songs have SUS files'); exit()
print(f'Missing {len(missing)} songs: {sorted(missing)}')

cat = fetch()
client = httpx.Client(http2=True, timeout=120, follow_redirects=True)
for r in cat.resources:
    if not r.name.endswith('.sus'): continue
    mid = r.name.replace('chart_','').rsplit('_',1)[0]
    if mid not in missing: continue
    resp = client.get(r.url)
    data = decrypt(resp.content, r.name)
    out = Path(f'/tmp/holodori_assets/resources/{r.name}')
    out.write_bytes(data)
    try:
        data.decode('utf-8')
        print(f'OK: {r.name} ({len(data)} bytes)')
    except:
        print(f'DECODE ERROR: {r.name}')
"

echo "==> Step 3: ビン集約データ生成 (chart_scores.json)"
uv run python3 scripts/generate_charts.py /tmp/holodori_assets/resources/ --output data/chart_scores.json --bin-size 0.5

echo "==> Step 4: ローカル用フルデータ生成 (charts.json)"
uv run python3 scripts/generate_charts.py /tmp/holodori_assets/resources/ --output data/charts.json

echo "==> 完了"
uv run python3 -c 'import json; c=json.load(open("data/chart_scores.json")); print(f"Charts: {len(c)}"); print(f"Songs: {len(set(v[\"music_id\"] for v in c.values()))}")'
"""

[tasks.bench]
description = "Goベンチマーク実行（結果をbenchmarks/に保存）"
run = "bash scripts/benchmark.sh"

[tasks."bench:wasm"]
description = "ネイティブ vs WASM パフォーマンス比較"
run = "uv run python scripts/benchmark_wasm.py"

[tasks."build:cli"]
description = "API Client CLIビルド"
run = "cd cli && go build -o holosolve ."
