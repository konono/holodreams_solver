[tools]
go = "1.24"
jq = "latest"
node = "22"
python = "3.13"
uv = "latest"

[tasks.setup]
description = "開発環境セットアップ（依存+ソルバー+ブラウザ）"
run = """
uv sync --group dev
cd solver_go && go build -o solver . && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o solver.wasm .
uv run playwright install --with-deps chromium
"""

[tasks.test]
description = "全テスト実行"
run = "uv run pytest -v"

[tasks."test:unit"]
description = "ユニットテストのみ"
run = "uv run pytest test_solver.py -v"

[tasks."test:e2e"]
description = "E2Eテストのみ"
run = "uv run pytest test_e2e.py -v"

[tasks.build]
description = "スタンドアロン版HTML生成"
run = "uv run python build_static.py"

[tasks."build:solver"]
description = "Goソルバービルド（CLI + WASM）"
run = """
cd solver_go && go build -o solver .
cd solver_go && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o solver.wasm .
"""

[tasks.dev]
description = "Goソルバーリビルド + 開発サーバー起動"
run = """
(cd solver_go && go build -o solver .)
uv run python app.py
"""

[tasks."sync:all"]
description = "全データ同期（カード + ボード + チャート）"
run = """
uv run python scripts/sync_holodori.py
python3 -m holodori_asset_tools download /tmp/holodori_assets --filter 'chart_m' --workers 4 --no-overwrite
python3 scripts/generate_charts.py /tmp/holodori_assets/resources/ --output data/chart_scores.json --bin-size 0.5
"""

[tasks."build:cli"]
description = "API Client CLIビルド"
run = "cd cli && go build -o holosolve ."
